<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tiles</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; background: #111827; color: #f3f4f6; overflow: hidden; }

        #game { display: flex; height: 100vh; position: relative; }
        .panel { flex: 1; position: relative; }
        #satellite, #guessmap { position: absolute; inset: 0; }
        .divider { width: 4px; background: #374151; z-index: 400; }

        /* Crosshair */
        #satellite::after {
            content: '+';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.75);
            font-size: 32px;
            font-weight: 300;
            pointer-events: none;
            z-index: 500;
        }

        /* HUD */
        #hud {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px; border-radius: 16px; display: flex; align-items: center;
            gap: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); min-width: 360px;
        }
        .status-text { font-size: 15px; font-weight: 500; }
        .score-badge { background: #2563eb; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; }
        
        .btn-primary {
            padding: 10px 20px; font-size: 14px; font-weight: 600; border: none;
            border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover:not(:disabled) { background: #1d4ed8; transform: translateY(-1px); }
        .btn-primary:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.6; }

        /* Modals Overlay */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center;
        }

        .modal-overlay.end-overlay {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: none;
            pointer-events: none;
        }

        .modal {
            background: #1f2937; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 32px; border-radius: 24px; width: 90%; max-width: 440px; text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        .modal h1 { margin-top: 0; font-size: 26px; color: #fff; }
        .modal p { color: #9ca3af; font-size: 14px; line-height: 1.5; }
        
        .form-group { margin: 16px 0; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
        .form-group select {
            width: 100%; padding: 10px; border-radius: 8px; background: #374151;
            border: 1px solid #4b5563; color: #fff; font-size: 14px; outline: none;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .stat-card { background: #374151; padding: 12px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 20px; font-weight: 700; color: #60a5fa; }
        .stat-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- Start -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal">
            <h1>World Tiles</h1>
            <p>Explore satellite imagery and guess the geographic location on the map!</p>
            
            <div class="form-group">
                <label for="difficulty-select">Map View Scale:</label>
                <select id="difficulty-select">
                    <option value="easy">Easy (~250 x 250 km region)</option>
                    <option value="medium" selected>Medium (~100 x 100 km region)</option>
                    <option value="hard">Hard (~50 x 50 km region)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="rounds-select">Number of Rounds:</label>
                <select id="rounds-select">
                    <option value="5" selected>5 Rounds</option>
                    <option value="10">10 Rounds</option>
                    <option value="15">15 Rounds</option>
                </select>
            </div>

            <button id="start-btn" class="btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;" disabled>Loading Locations...</button>
        </div>
    </div>

    <!-- End Game Modal -->
    <div id="end-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h1 id="end-title">Game Over</h1>
            <p id="end-rank" style="font-weight: 600; color: #60a5fa; font-size: 16px; margin-bottom: 8px;"></p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="end-score" class="stat-value">0 pts</div>
                    <div class="stat-label">Total Score</div>
                </div>
                <div class="stat-card">
                    <div id="end-accuracy" class="stat-value">0%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
            </div>

            <button id="restart-btn" class="btn-primary" style="width: 100%; padding: 12px;">Play Again</button>
        </div>
    </div>

    <!-- Main Game View -->
    <div id="game">
        <div id="hud">
            <span id="status" class="status-text">Round 1</span>
            <span id="score" class="score-badge">0 pts</span>
            <button id="btn" class="btn-primary" disabled style="margin-left: auto;">Check</button>
        </div>

        <div class="panel"><div id="satellite"></div></div>
        <div class="divider"></div>
        <div class="panel"><div id="guessmap"></div></div>
    </div>

    <script>
    // === Levels ===
    // 1 degree latitude ~ 111 km
    const DIFFICULTIES = {
        easy:   { d: 1.2,  zoom: 7 },  // ~260 km span box
        medium: { d: 0.45, zoom: 9 },  // ~100 km span box
        hard:   { d: 0.22, zoom: 10 }  // ~50 km span box
    };

    // === Maps ===
    const satMap = L.map('satellite', {
        zoomControl: true,
        attributionControl: false,
        maxBoundsViscosity: 1.0, // Locks scrolling strictly inside the bounds
        minZoom: 4
    }).setView([20, 0], 2);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
    }).addTo(satMap);

    const guessMap = L.map('guessmap', { worldCopyJump: true }).setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(guessMap);

    // Map Markers
    const guessIcon = L.divIcon({ 
        className: '',
        html: '<div style="width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5);"></div>', 
        iconSize: [16, 16], iconAnchor: [8, 8] 
    });
    const answerIcon = L.divIcon({ 
        className: '',
        html: '<div style="width:16px;height:16px;border-radius:50%;background:#ef4444;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5);"></div>', 
        iconSize: [16, 16], iconAnchor: [8, 8] 
    });

    // Game Variables
    let points = [];
    let totalRounds = 5;
    let currentDifficulty = DIFFICULTIES.medium;
    let round = 0, totalScore = 0;
    let answer = null, guess = null;
    let guessMarker = null, answerMarker = null, line = null;
    let phase = 'guessing';
    let gameHistory = [];
    let summaryLayers = [];

    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const btn = document.getElementById('btn');

    // === CSV ===
    fetch('points.csv')
        .then(r => r.text())
        .then(text => {
            const lines = text.trim().split('\n');
            lines.shift(); // Remove header line
            
            points = lines.map(line => {
                const p = line.split(',');
                return {
                    lng: parseFloat(p[0]),
                    lat: parseFloat(p[1]),
                    name: p[2] ? p[2].trim() : '',
                    country: p[3] ? p[3].trim() : '',
                    pop: p[4] ? parseInt(p[4]) : 0
                };
            }).filter(p => !isNaN(p.lat) && !isNaN(p.lng));

            const startBtn = document.getElementById('start-btn');
            startBtn.textContent = 'Start Game';
            startBtn.disabled = false;
        })
        .catch(() => {
            document.getElementById('start-btn').textContent = 'Error loading points.csv';
        });

    function clearSummaryLayers() {
        summaryLayers.forEach(l => guessMap.removeLayer(l));
        summaryLayers = [];
    }

    // === Start / Restart ===
    document.getElementById('start-btn').addEventListener('click', () => {
        totalRounds = parseInt(document.getElementById('rounds-select').value);
        const diffKey = document.getElementById('difficulty-select').value;
        currentDifficulty = DIFFICULTIES[diffKey];

        document.getElementById('start-modal').style.display = 'none';
        round = 0; totalScore = 0; gameHistory = [];
        clearSummaryLayers();
        scoreEl.textContent = `0 / ${totalRounds * 5000} pts`;
        startRound();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        const endModal = document.getElementById('end-modal');
        endModal.style.display = 'none';
        endModal.classList.remove('end-overlay');
        document.getElementById('start-modal').style.display = 'flex';
    });

    // === Round Control ===
    function startRound() {
        [guessMarker, answerMarker, line].forEach(l => l && guessMap.removeLayer(l));
        guessMarker = answerMarker = line = guess = null;
        phase = 'guessing';

        // Select random location
        answer = points[Math.floor(Math.random() * points.length)];

        // Set bounding box & locks around target coordinates
        const d = currentDifficulty.d;
        const bounds = [
            [answer.lat - d, answer.lng - d],
            [answer.lat + d, answer.lng + d]
        ];

        satMap.setMaxBounds(bounds);
        satMap.setView([answer.lat, answer.lng], currentDifficulty.zoom);

        // Reset right guess map to global view
        guessMap.setView([20, 0], 2);

        round++;
        statusEl.textContent = `Round ${round} of ${totalRounds}`;
        btn.textContent = 'Check';
        btn.disabled = true;
    }

    guessMap.on('click', e => {
        if (phase !== 'guessing') return;
        guess = [e.latlng.lat, e.latlng.lng];
        if (guessMarker) guessMap.removeLayer(guessMarker);
        guessMarker = L.marker(guess, { icon: guessIcon }).addTo(guessMap);
        btn.disabled = false;
    });

    // === Points (Max 5000) ===
    function calculateScore(distanceKm) {
        // Exponential decay based on distance
        const points = Math.round(5000 * Math.exp(-distanceKm / 2000));
        return Math.max(0, points);
    }

    btn.addEventListener('click', () => {
        if (phase === 'guessing') {
            if (!guess) return;

            const distMeters = L.latLng([answer.lat, answer.lng]).distanceTo(L.latLng(guess));
            const distKm = distMeters / 1000;
            const roundScore = calculateScore(distKm);
            
            totalScore += roundScore;
            gameHistory.push({ roundNum: round, answer, guess, distKm, roundScore });

            // Show answer marker and dashed line
            const answerCoords = [answer.lat, answer.lng];
            answerMarker = L.marker(answerCoords, { icon: answerIcon }).addTo(guessMap);
            line = L.polyline([guess, answerCoords], { color: '#9ca3af', weight: 2, dashArray: '6,6' }).addTo(guessMap);
            guessMap.fitBounds(L.latLngBounds([guess, answerCoords]).pad(0.3));

            const distText = distKm < 1 ? `${Math.round(distMeters)} m` : `${distKm.toFixed(1)} km`;
            const locationText = answer.name ? `📍 ${answer.name}, ${answer.country}` : `📍 ${answer.country}`;

            scoreEl.textContent = `${totalScore.toLocaleString()} pts`;
            statusEl.textContent = `+${roundScore} pts (${distText}) — ${locationText}`;

            phase = 'revealed';
            btn.textContent = round >= totalRounds ? 'Finish Game' : 'Next Round';
        } else if (phase === 'revealed') {
            if (round >= totalRounds) {
                showEndGameModal();
            } else {
                startRound();
            }
        }
    });

    // === End Game & Summary View ===
    function showEndGameModal() {
        [guessMarker, answerMarker, line].forEach(l => l && guessMap.removeLayer(l));

        const allCoords = [];

        gameHistory.forEach(h => {
            const answerCoords = [h.answer.lat, h.answer.lng];

            const gIcon = L.divIcon({
                className: '',
                html: `<div style="width:22px;height:22px;border-radius:50%;background:#2563eb;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.4);">${h.roundNum}</div>`,
                iconSize: [22, 22], iconAnchor: [11, 11]
            });

            const aIcon = L.divIcon({
                className: '',
                html: `<div style="width:22px;height:22px;border-radius:50%;background:#ef4444;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.4);">${h.roundNum}</div>`,
                iconSize: [22, 22], iconAnchor: [11, 11]
            });

            const mG = L.marker(h.guess, { icon: gIcon }).addTo(guessMap);
            const mA = L.marker(answerCoords, { icon: aIcon }).addTo(guessMap);

            const l = L.polyline([h.guess, answerCoords], {
                color: h.roundScore > 3000 ? '#10b981' : '#f97316',
                weight: 3,
                dashArray: '6,6'
            }).addTo(guessMap);

            summaryLayers.push(mG, mA, l);
            allCoords.push(h.guess, answerCoords);
        });

        if (allCoords.length > 0) {
            guessMap.fitBounds(L.latLngBounds(allCoords).pad(0.2));
        }

        const maxPossibleScore = totalRounds * 5000;
        const accuracy = Math.round((totalScore / maxPossibleScore) * 100);

        document.getElementById('end-score').textContent = `${totalScore.toLocaleString()} / ${maxPossibleScore.toLocaleString()}`;
        document.getElementById('end-accuracy').textContent = `${accuracy}%`;
        document.getElementById('end-rank').textContent = rank;

        const endModal = document.getElementById('end-modal');
        endModal.classList.add('end-overlay');
        endModal.style.display = 'flex';
    }
    </script>
</body>
</html>
