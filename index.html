<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tiles</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; background: #0f172a; color: #f8fafc; overflow: hidden; }

        /* Navigation Header */
        #top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: #1e293b; border-bottom: 1px solid #334155;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 1000;
        }
        .brand { font-size: 20px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .avatar-btn {
            background: #334155; border: 1px solid #475569; color: #fff; padding: 6px 16px;
            border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s;
        }
        .avatar-btn:hover { background: #475569; }

        /* Game Layout */
        #game { display: flex; height: calc(100vh - 60px); margin-top: 60px; position: relative; }
        .panel { flex: 1; position: relative; }
        #satellite, #guessmap { position: absolute; inset: 0; }
        .divider { width: 4px; background: #334155; z-index: 400; }

        /* HUD Bar */
        #hud {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px; border-radius: 16px; display: flex; align-items: center;
            gap: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); min-width: 440px;
        }
        .status-text { font-size: 14px; font-weight: 500; }
        .score-badge { background: #0284c7; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; }
        .timer-badge { background: #e11d48; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; display: none; }

        .btn-primary {
            padding: 10px 20px; font-size: 14px; font-weight: 600; border: none;
            border-radius: 10px; background: #0284c7; color: #fff; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover:not(:disabled) { background: #0369a1; transform: translateY(-1px); }
        .btn-primary:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }

        /* Modals Overlay */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 2000; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
        }

        .modal {
            background: #1e293b; border: 1px solid #334155;
            padding: 28px; border-radius: 24px; width: 90%; max-width: 540px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { margin-top: 0; font-size: 24px; color: #fff; }

        /* Tabs & Game Selection */
        .mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .mode-card {
            background: #0f172a; border: 2px solid #334155; border-radius: 14px;
            padding: 14px; cursor: pointer; text-align: center; transition: 0.2s;
        }
        .mode-card.active { border-color: #38bdf8; background: #1e293b; }
        .mode-card h3 { margin: 0 0 6px 0; font-size: 16px; color: #38bdf8; }
        .mode-card p { margin: 0; font-size: 12px; color: #94a3b8; }

        .form-group { margin: 14px 0; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .form-group select, .form-group input {
            width: 100%; padding: 10px; border-radius: 8px; background: #0f172a;
            border: 1px solid #334155; color: #fff; font-size: 14px; outline: none;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
        .stat-card { background: #0f172a; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .stat-value { font-size: 20px; font-weight: 700; color: #38bdf8; }
        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-top: 4px; }
        
        .mp-box { background: #0f172a; padding: 14px; border-radius: 12px; border: 1px dashed #475569; margin-top: 14px; text-align: center; }

        /* Achievements & Friends Styling */
        .achievements-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .achieve-item {
            background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 10px;
            display: flex; align-items: center; gap: 10px; opacity: 0.4; filter: grayscale(1);
        }
        .achieve-item.unlocked { opacity: 1; filter: grayscale(0); border-color: #38bdf8; }
        .achieve-icon { font-size: 22px; }
        .achieve-title { font-size: 12px; font-weight: 700; color: #fff; }
        .achieve-desc { font-size: 10px; color: #94a3b8; }

        .friends-list { max-height: 120px; overflow-y: auto; margin-top: 10px; }
        .friend-chip {
            background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div id="top-bar">
        <div class="brand">World Tiles</div>
        <div class="user-profile">
            <button id="profile-btn" class="avatar-btn">👤 <span id="username-display">Guest</span></button>
            <button id="menu-btn" class="btn-primary" style="padding: 6px 14px; font-size: 13px;">Main Menu</button>
        </div>
    </div>

    <!-- Main Game View -->
    <div id="game">
        <div id="hud">
            <span id="status" class="status-text">Round 1</span>
            <span id="timer" class="timer-badge">⏳ 03:00</span>
            <span id="score" class="score-badge">0 pts</span>
            <button id="btn" class="btn-primary" disabled style="margin-left: auto;">Check</button>
        </div>

        <div class="panel"><div id="satellite"></div></div>
        <div class="divider"></div>
        <div class="panel"><div id="guessmap"></div></div>
    </div>

    <!-- Menu / Lobby Modal -->
    <div id="lobby-modal" class="modal-overlay">
        <div class="modal">
            <h2>Select Game Mode</h2>
            
            <div class="mode-selector">
                <div class="mode-card active" data-mode="tiles" onclick="selectGameMode('tiles')">
                    <h3>World Tiles</h3>
                    <p>Guess region boundaries from satellite views</p>
                </div>
                <div class="mode-card" data-mode="cities" onclick="selectGameMode('cities')">
                    <h3>Guess the City</h3>
                    <p>Identify specific cities worldwide</p>
                </div>
            </div>

            <!-- Mode-specific Difficulty -->
            <div id="tiles-diff-group" class="form-group">
                <label>Tile View Size:</label>
                <select id="tiles-difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>

            <div id="cities-diff-group" class="form-group" style="display: none;">
                <label>City Population Range:</label>
                <select id="cities-difficulty">
                    <option value="easy">Easy (3M+ Big cities)</option>
                    <option value="medium" selected>Medium (1M - 3M Large Cities)</option>
                    <option value="hard">Hard (100k - 1M Cities)</option>
                    <option value="expert">Mega Hard (&lt; 100k Small Towns)</option>
                </select>
            </div>

            <!-- Rules -->
            <div class="form-group">
                <label>Format:</label>
                <select id="format-select" onchange="toggleFormatOptions()">
                    <option value="rounds" selected>Classic (No time limit)</option>
                    <option value="timed_total">Time Attack (Total game time)</option>
                    <option value="timed_round">Blitz (Time per round)</option>
                </select>
            </div>

            <div id="rounds-group" class="form-group">
                <label>Rounds Count:</label>
                <select id="rounds-select">
                    <option value="5" selected>5 Rounds</option>
                    <option value="10">10 Rounds</option>
                    <option value="15">15 Rounds</option>
                </select>
            </div>

            <div id="timed-total-group" class="form-group" style="display: none;">
                <label>Total Match Time:</label>
                <select id="timer-total-select">
                    <option value="60">1 Minute</option>
                    <option value="180" selected>3 Minutes</option>
                    <option value="300">5 Minutes</option>
                </select>
            </div>

            <div id="timed-round-group" class="form-group" style="display: none;">
                <label>Seconds Per Round:</label>
                <select id="timer-round-select">
                    <option value="10">10 Seconds</option>
                    <option value="20" selected>20 Seconds</option>
                    <option value="30">30 Seconds</option>
                </select>
            </div>

            <!-- Multiplayer -->
            <div class="form-group">
                <label>Match Type:</label>
                <select id="match-type" onchange="toggleMultiplayerUI()">
                    <option value="single" selected>Singleplayer</option>
                    <option value="multi">Multiplayer</option>
                </select>
            </div>

            <div id="mp-box" class="mp-box" style="display: none;">
                <p style="font-size: 12px; color: #94a3b8; margin: 0 0 10px 0;">Multiplayer Lobby Code:</p>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="room-code" placeholder="Enter Room Code..." style="text-align: center; font-weight: 700; text-transform: uppercase;">
                    <button class="btn-primary" onclick="createRoom()">Create</button>
                </div>
            </div>

            <button id="start-btn" class="btn-primary" style="width: 100%; padding: 12px; margin-top: 16px;" disabled>Loading Points...</button>
        </div>
    </div>

    <!-- User Profile -->
    <div id="profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h2>User Profile</h2>
            <div style="background: #0f172a; padding: 10px 14px; border-radius: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <span style="font-size: 12px; color: #94a3b8;">Your User ID:</span>
                <span id="user-id-display" style="font-weight: 700; color: #38bdf8; font-size: 14px;">#GEO-0000</span>
            </div>

            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="username-input" placeholder="Enter name...">
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div id="user-games" class="stat-value">0</div>
                    <div class="stat-label">Games Played</div>
                </div>
                <div class="stat-card">
                    <div id="user-highscore" class="stat-value">0</div>
                    <div class="stat-label">Highscore</div>
                </div>
            </div>

            <!-- Achievements -->
            <label style="font-size: 13px; color: #94a3b8; display: block; margin-top: 10px;">Achievements:</label>
            <div id="achievements-container" class="achievements-list"></div>

            <!-- Friends -->
            <label style="font-size: 13px; color: #94a3b8; display: block; margin-top: 14px;">Friends List:</label>
            <div style="display: flex; gap: 8px; margin-top: 6px;">
                <input type="text" id="friend-id-input" placeholder="Enter Friend ID (#GEO-XXXX)..." style="font-size: 12px;">
                <button class="btn-primary" onclick="addFriend()" style="padding: 6px 12px; font-size: 12px;">Add</button>
            </div>
            <div id="friends-container" class="friends-list"></div>

            <div style="display: flex; gap: 10px; margin-top: 16px;">
                <button class="btn-primary" onclick="saveProfile()" style="flex: 1;">Save Profile</button>
                <button class="btn-primary" onclick="closeProfile()" style="flex: 1; background: #475569;">Close</button>
            </div>
        </div>
    </div>

    <!-- End Game -->
    <div id="end-modal" class="modal-overlay" style="display: none;">
        <div class="modal" style="text-align: center;">
            <h1>Game Over</h1>
            <p id="end-rank" style="font-weight: 600; color: #38bdf8; font-size: 16px; margin-bottom: 8px;"></p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="end-score" class="stat-value">0 pts</div>
                    <div class="stat-label">Total Score</div>
                </div>
                <div class="stat-card">
                    <div id="end-accuracy" class="stat-value">0%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
            </div>

            <button onclick="openLobby()" class="btn-primary" style="width: 100%; padding: 12px;">Back to Menu</button>
        </div>
    </div>

    <script>
    const TILES_DIFF = { easy: { d: 1.2 }, medium: { d: 0.5 }, hard: { d: 0.2 } };

    const ACHIEVEMENTS = [
        { id: 'first_game', title: 'First Steps', desc: 'Complete 1 game' },
        { id: 'perfect_hit', title: 'Bullseye', desc: 'Get a 5,000 pts score' },
        { id: 'blitz_master', title: 'Speed Demon', desc: 'Play in Blitz mode' },
        { id: 'town_explorer', title: 'Town Explorer', desc: 'Play in Mega Hard City mode' }
    ];

    // User Profile 
    let currentUser = JSON.parse(localStorage.getItem('geo_user_v2')) || {
        id: '#GEO-' + Math.random().toString(36).substring(2, 6).toUpperCase(),
        name: 'Player' + Math.floor(1000 + Math.random() * 9000),
        gamesPlayed: 0,
        highScore: 0,
        unlockedAchieve: [],
        friends: []
    };

    function updateProfileUI() {
        document.getElementById('username-display').textContent = currentUser.name;
        document.getElementById('username-input').value = currentUser.name;
        document.getElementById('user-id-display').textContent = currentUser.id;
        document.getElementById('user-games').textContent = currentUser.gamesPlayed;
        document.getElementById('user-highscore').textContent = currentUser.highScore;

        // Render Achievements
        const achContainer = document.getElementById('achievements-container');
        achContainer.innerHTML = '';
        ACHIEVEMENTS.forEach(a => {
            const isUnlocked = currentUser.unlockedAchieve.includes(a.id);
            achContainer.innerHTML += `
                <div class="achieve-item ${isUnlocked ? 'unlocked' : ''}">
                    <div class="achieve-icon">${a.icon}</div>
                    <div>
                        <div class="achieve-title">${a.title}</div>
                        <div class="achieve-desc">${a.desc}</div>
                    </div>
                </div>`;
        });

        // Friends
        const friendContainer = document.getElementById('friends-container');
        friendContainer.innerHTML = '';
        if (currentUser.friends.length === 0) {
            friendContainer.innerHTML = '<div style="font-size:11px; color:#64748b; margin-top:6px;">No friends added yet.</div>';
        } else {
            currentUser.friends.forEach(fId => {
                friendContainer.innerHTML += `<div class="friend-chip"><span>👤 ${fId}</span><span style="color:#10b981; font-size:10px;">● Online</span></div>`;
            });
        }
    }

    function unlockAchievement(id) {
        if (!currentUser.unlockedAchieve.includes(id)) {
            currentUser.unlockedAchieve.push(id);
            localStorage.setItem('geo_user_v2', JSON.stringify(currentUser));
        }
    }

    function saveProfile() {
        const inputName = document.getElementById('username-input').value.trim();
        if (inputName) currentUser.name = inputName;
        localStorage.setItem('geo_user_v2', JSON.stringify(currentUser));
        updateProfileUI();
        closeProfile();
    }

    function addFriend() {
        const fInput = document.getElementById('friend-id-input');
        const fId = fInput.value.trim().toUpperCase();
        if (fId && !currentUser.friends.includes(fId) && fId !== currentUser.id) {
            currentUser.friends.push(fId);
            localStorage.setItem('geo_user_v2', JSON.stringify(currentUser));
            fInput.value = '';
            updateProfileUI();
        }
    }

    document.getElementById('profile-btn').addEventListener('click', () => {
        updateProfileUI();
        document.getElementById('profile-modal').style.display = 'flex';
    });
    function closeProfile() { document.getElementById('profile-modal').style.display = 'none'; }

    // === Maps ===
    const satMap = L.map('satellite', { zoomControl: true, attributionControl: false, maxBoundsViscosity: 1.0 }).setView([20, 0], 2);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, maxNativeZoom: 17 }).addTo(satMap);

    const guessMap = L.map('guessmap', { maxBounds: [[-90, -180], [90, 180]], maxBoundsViscosity: 0.8 }).setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19, noWrap: true }).addTo(guessMap);

    const guessIcon = L.divIcon({
        className: '',
        html: '<div style="width:16px;height:16px;border-radius:50%;background:#0284c7;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5);"></div>',
        iconSize: [16, 16], iconAnchor: [8, 8]
    });

    // Variables
    let allPoints = [], activePointsPool = [];
    let currentGameMode = 'tiles', formatMode = 'rounds';
    let timeRemaining = 0, timerInterval = null;
    let totalRounds = 5, round = 0, totalScore = 0;
    let answer = null, guess = null, currentBounds = null;
    let guessMarker = null, targetRect = null, line = null;
    let phase = 'guessing', gameHistory = [], summaryLayers = [];

    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const btn = document.getElementById('btn');

    // === CSV ===
    fetch('points.csv')
        .then(r => r.text())
        .then(text => {
            const lines = text.trim().split('\n');
            lines.shift();
            
            allPoints = lines.map(line => {
                const p = line.split(',');
                return {
                    lng: parseFloat(p[0]),
                    lat: parseFloat(p[1]),
                    name: p[2] ? p[2].trim() : '',
                    country: p[3] ? p[3].trim() : '',
                    pop: p[4] ? parseInt(p[4]) : 0
                };
            }).filter(p => !isNaN(p.lat) && !isNaN(p.lng));

            const startBtn = document.getElementById('start-btn');
            startBtn.textContent = 'Start Game';
            startBtn.disabled = false;
        })
        .catch(() => {
            document.getElementById('start-btn').textContent = 'Error loading points.csv';
        });

    function selectGameMode(mode) {
        currentGameMode = mode;
        document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
        document.querySelector(`.mode-card[data-mode="${mode}"]`).classList.add('active');

        document.getElementById('tiles-diff-group').style.display = mode === 'tiles' ? 'block' : 'none';
        document.getElementById('cities-diff-group').style.display = mode === 'cities' ? 'block' : 'none';
    }

    function toggleFormatOptions() {
        formatMode = document.getElementById('format-select').value;
        document.getElementById('rounds-group').style.display = (formatMode === 'rounds' || formatMode === 'timed_round') ? 'block' : 'none';
        document.getElementById('timed-total-group').style.display = formatMode === 'timed_total' ? 'block' : 'none';
        document.getElementById('timed-round-group').style.display = formatMode === 'timed_round' ? 'block' : 'none';
    }

    function toggleMultiplayerUI() {
        const type = document.getElementById('match-type').value;
        document.getElementById('mp-box').style.display = type === 'multi' ? 'block' : 'none';
    }

    function createRoom() {
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        document.getElementById('room-code').value = code;
        alert(`Room created! Share code: ${code}`);
    }

    function openLobby() {
        clearInterval(timerInterval);
        document.getElementById('end-modal').style.display = 'none';
        document.getElementById('lobby-modal').style.display = 'flex';
    }

    document.getElementById('menu-btn').addEventListener('click', openLobby);

    // === Start ===
    document.getElementById('start-btn').addEventListener('click', () => {
        // Filter city population by exact ranges
        if (currentGameMode === 'cities') {
            const diff = document.getElementById('cities-difficulty').value;
            if (diff === 'easy') activePointsPool = allPoints.filter(p => p.pop >= 3000000);
            else if (diff === 'medium') activePointsPool = allPoints.filter(p => p.pop >= 1000000 && p.pop < 3000000);
            else if (diff === 'hard') activePointsPool = allPoints.filter(p => p.pop >= 100000 && p.pop < 1000000);
            else if (diff === 'expert') {
                activePointsPool = allPoints.filter(p => p.pop > 0 && p.pop < 100000);
                unlockAchievement('town_explorer');
            }
            
            if (activePointsPool.length === 0) activePointsPool = allPoints; // Fallback
        } else {
            activePointsPool = [...allPoints];
        }

        totalRounds = parseInt(document.getElementById('rounds-select').value);

        if (formatMode === 'timed_total') {
            timeRemaining = parseInt(document.getElementById('timer-total-select').value);
            timerEl.style.display = 'inline-block';
            startTotalTimer();
        } else if (formatMode === 'timed_round') {
            timerEl.style.display = 'inline-block';
            unlockAchievement('blitz_master');
        } else {
            timerEl.style.display = 'none';
        }

        document.getElementById('lobby-modal').style.display = 'none';
        round = 0; totalScore = 0; gameHistory = [];
        summaryLayers.forEach(l => guessMap.removeLayer(l));
        summaryLayers = [];

        scoreEl.textContent = `0 pts`;
        
        setTimeout(() => {
            satMap.invalidateSize();
            guessMap.invalidateSize();
            startRound();
        }, 50);
    });

    function startTotalTimer() {
        clearInterval(timerInterval);
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimerDisplay();
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                showEndGameModal();
            }
        }, 1000);
    }

    function startRoundTimer() {
        clearInterval(timerInterval);
        timeRemaining = parseInt(document.getElementById('timer-round-select').value);
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimerDisplay();
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                // Force empty guess if user ran out of time
                if (phase === 'guessing') {
                    guess = [0, 0]; // Default missed guess
                    processGuess();
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        timerEl.textContent = `⏳ ${m}:${s}`;
    }

    // === Round ===
    function startRound() {
        [guessMarker, targetRect, line].forEach(l => l && guessMap.removeLayer(l));
        guessMarker = targetRect = line = guess = null;
        phase = 'guessing';

        answer = activePointsPool[Math.floor(Math.random() * activePointsPool.length)];

        let d = 0.5;
        if (currentGameMode === 'tiles') {
            const diffKey = document.getElementById('tiles-difficulty').value;
            d = TILES_DIFF[diffKey].d;
        } else {
            d = 0.15;
        }

        currentBounds = L.latLngBounds([
            [answer.lat - d, answer.lng - d],
            [answer.lat + d, answer.lng + d]
        ]);

        satMap.setMinZoom(1);
        satMap.setMaxBounds(null);
        satMap.fitBounds(currentBounds);

        setTimeout(() => {
            satMap.setMinZoom(satMap.getZoom());
            satMap.setMaxBounds(currentBounds);
        }, 50);

        guessMap.setView([20, 0], 2);

        round++;
        statusEl.textContent = formatMode === 'timed_total' ? `Round ${round}` : `Round ${round} of ${totalRounds}`;
        btn.textContent = 'Check';
        btn.disabled = true;

        if (formatMode === 'timed_round') {
            startRoundTimer();
        }
    }

    guessMap.on('click', e => {
        if (phase !== 'guessing') return;
        const wrapped = e.latlng.wrap();
        guess = [wrapped.lat, wrapped.lng];

        if (guessMarker) guessMap.removeLayer(guessMarker);
        guessMarker = L.marker(guess, { icon: guessIcon }).addTo(guessMap);
        btn.disabled = false;
    });

    btn.addEventListener('click', () => {
        if (phase === 'guessing') {
            processGuess();
        } else if (phase === 'revealed') {
            if (formatMode !== 'timed_total' && round >= totalRounds) {
                showEndGameModal();
            } else {
                startRound();
            }
        }
    });

    function processGuess() {
        clearInterval(timerInterval);
        if (!guess) return;

        const guessLatLng = L.latLng(guess);
        const isInside = currentBounds.contains(guessLatLng);
        
        let roundScore = 0;
        let distKm = 0;

        if (isInside) {
            roundScore = 5000;
            unlockAchievement('perfect_hit');
        } else {
            const centerLatLng = L.latLng([answer.lat, answer.lng]);
            const distMeters = centerLatLng.distanceTo(guessLatLng);
            distKm = distMeters / 1000;
            roundScore = Math.max(0, Math.round(5000 * Math.exp(-distKm / 2000)));
        }

        totalScore += roundScore;
        gameHistory.push({ roundNum: round, answer, guess, bounds: currentBounds, isInside, distKm, roundScore });

        targetRect = L.rectangle(currentBounds, {
            color: '#ef4444', weight: 2, fillColor: '#ef4444', fillOpacity: 0.25
        }).addTo(guessMap);

        const center = [answer.lat, answer.lng];
        if (!isInside) {
            line = L.polyline([guess, center], { color: '#9ca3af', weight: 2, dashArray: '6,6' }).addTo(guessMap);
            guessMap.fitBounds(L.latLngBounds([guess, ...currentBounds.toBBoxString().split(',').map(Number)]).pad(0.3));
        } else {
            guessMap.fitBounds(currentBounds.pad(0.4));
        }

        scoreEl.textContent = `${totalScore.toLocaleString()} pts`;
        
        const resultDetail = isInside ? `Perfect!` : `Off by ${distKm.toFixed(1)} km`;
        if (currentGameMode === 'cities') {
            const locationText = answer.name ? `📍 ${answer.name}, ${answer.country}` : `📍 ${answer.country}`;
            statusEl.textContent = `+${roundScore} pts (${resultDetail}) — ${locationText}`;
        } else {
            statusEl.textContent = `+${roundScore} pts (${resultDetail})`;
        }

        phase = 'revealed';
        btn.textContent = (formatMode !== 'timed_total' && round >= totalRounds) ? 'Finish Game' : 'Next Round';
        btn.disabled = false;
    }

    // === End Game ===
    function showEndGameModal() {
        clearInterval(timerInterval);
        phase = 'finished';
        btn.disabled = true;
        btn.textContent = 'Game Over';

        [guessMarker, targetRect, line].forEach(l => l && guessMap.removeLayer(l));

        // Achievements & Stats
        currentUser.gamesPlayed++;
        unlockAchievement('first_game');
        if (totalScore > currentUser.highScore) currentUser.highScore = totalScore;
        localStorage.setItem('geo_user_v2', JSON.stringify(currentUser));

        const allCoords = [];
        gameHistory.forEach(h => {
            const centerCoords = [h.answer.lat, h.answer.lng];

            const gIcon = L.divIcon({
                className: '',
                html: `<div style="width:22px;height:22px;border-radius:50%;background:#0284c7;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.4);">${h.roundNum}</div>`,
                iconSize: [22, 22], iconAnchor: [11, 11]
            });

            const mG = L.marker(h.guess, { icon: gIcon }).addTo(guessMap);
            const rect = L.rectangle(h.bounds, {
                color: h.isInside ? '#10b981' : '#ef4444',
                weight: 2, fillColor: h.isInside ? '#10b981' : '#ef4444', fillOpacity: 0.25
            }).addTo(guessMap);

            summaryLayers.push(mG, rect);
            allCoords.push(h.guess, centerCoords);
        });

        if (allCoords.length > 0) guessMap.fitBounds(L.latLngBounds(allCoords).pad(0.2));

        const maxScore = gameHistory.length * 5000;
        const accuracy = maxScore > 0 ? Math.round((totalScore / maxScore) * 100) : 0;


        document.getElementById('end-score').textContent = `${totalScore.toLocaleString()} pts`;
        document.getElementById('end-accuracy').textContent = `${accuracy}%`;
        document.getElementById('end-rank').textContent = rank;

        document.getElementById('end-modal').style.display = 'flex';
    }

    updateProfileUI();
    </script>
</body>
</html>
